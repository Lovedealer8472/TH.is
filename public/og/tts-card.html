<!DOCTYPE html>
<html lang="is"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: oklch(11% 0.003 190); color: oklch(96% 0.005 170); font-family: "Outfit", system-ui, sans-serif; position: relative; }
  .brand { position: absolute; left: 72px; top: 60px; font-weight: 700; font-size: 30px; }
  .brand span { font-family: "JetBrains Mono", monospace; font-size: 20px; color: oklch(65% 0.17 158); margin-left: 6px; }
  .kicker { position: absolute; left: 72px; top: 150px; font-family: "JetBrains Mono", monospace; font-size: 22px; color: oklch(65% 0.17 158); }
  h1 { position: absolute; left: 72px; top: 190px; margin: 0; width: 900px; font-size: 76px; line-height: 1.04; letter-spacing: -0.022em; font-weight: 700; }
  h1 em { font-style: normal; color: oklch(65% 0.17 158); }
  .sub { position: absolute; left: 72px; top: 380px; width: 760px; font-family: "Outfit"; font-weight: 600; font-size: 28px; color: oklch(75% 0.010 170); line-height: 1.35; }
  .wave { position: absolute; left: 72px; right: 72px; bottom: 56px; height: 96px; display: flex; align-items: center; gap: 5px; }
  .wave i { display: block; width: 6px; border-radius: 3px; background: oklch(30% 0.010 170); }
  .wave i.on { background: oklch(65% 0.17 158); }
  .lamp { position: absolute; right: 72px; top: 66px; display: flex; align-items: center; gap: 12px; font-family: "JetBrains Mono", monospace; font-size: 18px; letter-spacing: 0.08em; color: oklch(75% 0.010 170); }
  .lamp b { width: 14px; height: 14px; border-radius: 50%; background: oklch(65% 0.17 158); box-shadow: 0 0 0 8px oklch(65% 0.17 158 / 0.16); }
</style></head>
<body>
  <div class="brand">Tölvuhvíslarinn<span>.is</span></div>
  <div class="lamp"><b></b>Í LOFTINU</div>
  <div class="kicker">Salka · íslensk talgerving</div>
  <h1>Íslenskt tal, <em>þjálfað á Íslandi.</em></h1>
  <div class="sub">Skrifaðu setningu, hlustaðu strax. Keyrir á venjulegum örgjörva — líka í þínu kerfi. Enginn texti vistaður.</div>
  <div class="wave" id="w"></div>
  <script>
    var w = document.getElementById("w"), n = 96;
    for (var i = 0; i < n; i++) {
      var t = i / n, env = Math.sin(t * Math.PI) * (0.55 + 0.45 * Math.abs(Math.sin(i * 1.7 + Math.cos(i * 0.37) * 2)));
      var b = document.createElement("i"); b.style.height = Math.max(6, env * 96) + "px"; if (t < 0.58) { b.className = "on"; }
      w.appendChild(b);
    }
  </script>
</body></html>
